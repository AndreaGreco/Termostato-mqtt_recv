services:
  thermopro-import:
    build: termalpro-import/
    environment:
      - PG_DB=termostato
      - PG_USER=termostato
      - PG_PASS=IkyipShoownAd2
      - PG_HOST=timescaledb
      - PG_PORT=5432
      - SENSOR_ID=TP357S
    volumes:
      - .:/data
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - meteo-station
    restart: "no"

  migrate:
    build: go-client/
    entrypoint: ["tern", "migrate", "-c", "/app/tern.conf", "-m", "/app/migrations"]
    environment:
      - PG_DB=termostato
      - PG_USER=termostato
      - PG_PASS=IkyipShoownAd2
      - PG_HOST=timescaledb
      - PG_PORT=5432
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - meteo-station
    restart: "no"

  mqttclient:
    build: go-client/
    restart: unless-stopped
    environment:
      - PG_DB=termostato
      - PG_USER=termostato
      - PG_PASS=IkyipShoownAd2
      - PG_HOST=timescaledb
      - PG_PORT=5432
      - MQTT_URI=mqtt://mosquitto:1885
    volumes:
      - ./go-client/init_existing_db.sql:/app/init_existing_db.sql:ro
      - ./coredumps:/data/coredumps
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks:
      - meteo-station

  mosquitto:
    container_name: mosquitto
    restart: unless-stopped
    image: eclipse-mosquitto
    networks:
      - meteo-station
    volumes:
    - "./infra/mosquitto/config:/mosquitto/config"
    - "./infra/mosquitto/log:/mosquitto/log"
    - "./infra/mosquitto/data/:/mosquitto/data"
    ports:
    - "1885:1885"

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    networks:
      - meteo-station
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=termostato
      - POSTGRES_USER=termostato
      - POSTGRES_PASSWORD=IkyipShoownAd2
    volumes:
      - term_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termostato"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    container_name: grafana
    networks:
      - meteo-station
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - term_grafana:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy

networks:
  meteo-station:
    name: meteo-station

volumes:
  term_pgdata:
    driver: local
  term_grafana:
    driver: local
