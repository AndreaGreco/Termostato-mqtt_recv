version: '3.8'

services:
  mqttclient:
    build: go-client/
    environment:
      - PG_DB=meteo_station
      - PG_USER=meteo_station
      - PG_PASS=IkyipShoownAd2
      - PG_HOST=timescaledb
      - MQTT_URI=mqtt://mosquitto:1883
    networks:
      - meteo-station

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto
    networks:
      - meteo-station
    volumes:
    - "./infra/mosquitto/config:/mosquitto/config"
    - "./infra/mosquitto/log:/mosquitto/log"
    - "./infra/mosquitto/data/:/mosquitto/data"
    ports:
    - "1883:1883"

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    command: postgres -c shared_preload_libraries=timescaledb
    networks:
      - meteo-station
    ports:
      - "5432:5432"
    environment:
      - PGDATA=/var/lib/postgresql/data/timescaledb
      - POSTGRES_DB=meteo_station
      - POSTGRES_USER=meteo_station
      - POSTGRES_PASSWORD=IkyipShoownAd2
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/db/:/docker-entrypoint-initdb.d/

  grafana:
    image: grafana/grafana:10.0.2
    networks:
      - meteo-station
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana

networks:
  meteo-station:
    name: meteo-station

volumes:
  postgres-data:
    driver: local
  grafana-data:
    driver: local
